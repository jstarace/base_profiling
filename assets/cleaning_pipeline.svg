<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4A55"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#2B2B33">Cleaning pipeline, per row</text>
  <text x="20" y="44" font-size="11" fill="#6B6B75">harness.py: one CleaningRecord logged per row; the canonical sentence array is the shared coordinate system</text>

  <!-- Row 1, left to right -->
  <rect x="20" y="62" width="150" height="88" rx="8" fill="#FFFFFF" stroke="#3D5A80" stroke-dasharray="5 4"/>
  <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2B33">row text</text>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#6B6B75">from</text>
  <text x="95" y="133" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#6B6B75">pre_clean_data</text>

  <rect x="210" y="62" width="190" height="88" rx="8" fill="#EDF1F7" stroke="#3D5A80"/>
  <text x="305" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, monospace" fill="#2B2B33">segment()</text>
  <text x="305" y="106" text-anchor="middle" font-size="11" fill="#6B6B75">delimiter split + syntok,</text>
  <text x="305" y="121" text-anchor="middle" font-size="11" fill="#6B6B75">canonical sentences</text>
  <text x="305" y="136" text-anchor="middle" font-size="11" fill="#6B6B75">with char offsets</text>

  <rect x="440" y="62" width="210" height="88" rx="8" fill="#EDF1F7" stroke="#3D5A80"/>
  <text x="545" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2B2B33">panel detect</text>
  <text x="545" y="106" text-anchor="middle" font-size="11" fill="#6B6B75">3 judges flag canonical</text>
  <text x="545" y="121" text-anchor="middle" font-size="11" fill="#6B6B75">indices, each flag carries</text>
  <text x="545" y="136" text-anchor="middle" font-size="11" fill="#6B6B75">a verbatim quote</text>

  <rect x="690" y="62" width="200" height="88" rx="8" fill="#EDF1F7" stroke="#3D5A80"/>
  <text x="790" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, monospace" fill="#2B2B33">standardize()</text>
  <text x="790" y="106" text-anchor="middle" font-size="11" fill="#6B6B75">validate quotes, drop</text>
  <text x="790" y="121" text-anchor="middle" font-size="11" fill="#6B6B75">mis-indexed flags, tally</text>
  <text x="790" y="136" text-anchor="middle" font-size="11" fill="#6B6B75">anonymous votes</text>

  <line x1="170" y1="106" x2="206" y2="106" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="400" y1="106" x2="436" y2="106" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="650" y1="106" x2="686" y2="106" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- down to row 2 -->
  <line x1="790" y1="150" x2="790" y2="186" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- Row 2, right to left -->
  <rect x="690" y="190" width="200" height="88" rx="8" fill="#EDF1F7" stroke="#B3543F"/>
  <text x="790" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2B2B33">gates</text>
  <text x="790" y="234" text-anchor="middle" font-size="11" fill="#6B6B75">row gate: majority of</text>
  <text x="790" y="249" text-anchor="middle" font-size="11" fill="#6B6B75">verdicts; sentence gate:</text>
  <text x="790" y="264" text-anchor="middle" font-size="11" fill="#6B6B75">votes at or above majority</text>

  <rect x="440" y="190" width="210" height="88" rx="8" fill="#EDF1F7" stroke="#3D5A80"/>
  <text x="545" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2B2B33">final judge decide</text>
  <text x="545" y="234" text-anchor="middle" font-size="11" fill="#6B6B75">cut / rephrase / veto,</text>
  <text x="545" y="249" text-anchor="middle" font-size="11" fill="#6B6B75">on majority sentences only</text>

  <rect x="210" y="190" width="190" height="88" rx="8" fill="#EDF1F7" stroke="#3D5A80"/>
  <text x="305" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, monospace" fill="#2B2B33">transformer.apply</text>
  <text x="305" y="234" text-anchor="middle" font-size="11" fill="#6B6B75">offset span edits, same</text>
  <text x="305" y="249" text-anchor="middle" font-size="11" fill="#6B6B75">model as the final judge</text>

  <rect x="20" y="190" width="150" height="88" rx="8" fill="#F3ECF5" stroke="#7B4E8C"/>
  <text x="95" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B2B33">cleaned row</text>
  <text x="95" y="236" text-anchor="middle" font-size="11" fill="#6B6B75">+ JSONL log</text>
  <text x="95" y="251" text-anchor="middle" font-size="11" fill="#6B6B75">+ Markdown report</text>

  <line x1="690" y1="234" x2="654" y2="234" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="440" y1="234" x2="404" y2="234" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="210" y1="234" x2="174" y2="234" stroke="#4A4A55" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- gate branch -->
  <line x1="790" y1="278" x2="790" y2="326" stroke="#4A4A55" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr2)"/>
  <rect x="640" y="330" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#9A9AA5" stroke-dasharray="5 4"/>
  <text x="790" y="352" text-anchor="middle" font-size="11" fill="#4A4A55">below the gates: text unchanged</text>
  <text x="790" y="370" text-anchor="middle" font-size="10.5" font-family="Menlo, monospace" fill="#6B6B75">clean / all_no_action / no_action</text>

  <!-- action vocabulary note -->
  <rect x="20" y="330" width="580" height="110" rx="8" fill="#F5F5F7" stroke="#B9B9C2"/>
  <text x="38" y="354" font-size="12" font-weight="bold" fill="#2B2B33">action vocabulary</text>
  <text x="38" y="376" font-size="11" fill="#4A4A55"><tspan font-family="Menlo, monospace">no_action</tspan>: below the vote gate, never reviewed</text>
  <text x="38" y="396" font-size="11" fill="#4A4A55"><tspan font-family="Menlo, monospace">veto</tspan>: reviewed by the final judge and overturned (distinct from no_action)</text>
  <text x="38" y="416" font-size="11" fill="#4A4A55"><tspan font-family="Menlo, monospace">cut / rephrase</tspan>: reviewed, text edited by character-offset span</text>
</svg>
