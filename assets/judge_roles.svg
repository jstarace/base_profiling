<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#2B2B33">Judge adapters and roles</text>
  <text x="20" y="44" font-size="11" fill="#6B6B75">every adapter can fill every role; the config in use was selected by the v1 ablation (noD__final-D)</text>

  <!-- header -->
  <rect x="20" y="66" width="700" height="40" fill="#F5F5F7" stroke="#B9B9C2"/>
  <text x="38" y="91" font-size="12" font-weight="bold" fill="#2B2B33">adapter (default model)</text>
  <text x="345" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D5A80">panelist</text>
  <text x="495" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#C08A3E">final judge</text>
  <text x="645" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B4E8C">transformer</text>

  <!-- rows -->
  <rect x="20" y="106" width="700" height="56" fill="#FFFFFF" stroke="#B9B9C2"/>
  <text x="38" y="130" font-size="12.5" font-weight="bold" fill="#2B2B33">Gemini</text>
  <text x="38" y="149" font-size="11" font-family="Menlo, monospace" fill="#6B6B75">gemini-2.5-flash</text>
  <circle cx="345" cy="134" r="9" fill="#3D5A80"/>
  <circle cx="495" cy="134" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>
  <circle cx="645" cy="134" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>

  <rect x="20" y="162" width="700" height="56" fill="#FAFAFB" stroke="#B9B9C2"/>
  <text x="38" y="186" font-size="12.5" font-weight="bold" fill="#2B2B33">Anthropic</text>
  <text x="38" y="205" font-size="11" font-family="Menlo, monospace" fill="#6B6B75">claude-haiku-4-5</text>
  <circle cx="345" cy="190" r="9" fill="#3D5A80"/>
  <circle cx="495" cy="190" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>
  <circle cx="645" cy="190" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>

  <rect x="20" y="218" width="700" height="56" fill="#FFFFFF" stroke="#B9B9C2"/>
  <text x="38" y="242" font-size="12.5" font-weight="bold" fill="#2B2B33">OpenAI</text>
  <text x="38" y="261" font-size="11" font-family="Menlo, monospace" fill="#6B6B75">gpt-4o</text>
  <circle cx="345" cy="246" r="9" fill="#3D5A80"/>
  <circle cx="495" cy="246" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>
  <circle cx="645" cy="246" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>

  <rect x="20" y="274" width="700" height="56" fill="#FAFAFB" stroke="#B9B9C2"/>
  <text x="38" y="298" font-size="12.5" font-weight="bold" fill="#2B2B33">DeepSeek</text>
  <text x="38" y="317" font-size="11" font-family="Menlo, monospace" fill="#6B6B75">deepseek-chat</text>
  <circle cx="345" cy="302" r="9" fill="none" stroke="#C4C4CC" stroke-width="2"/>
  <circle cx="495" cy="302" r="9" fill="#C08A3E"/>
  <circle cx="645" cy="302" r="9" fill="#7B4E8C"/>
  <!-- bound roles -->
  <line x1="506" y1="302" x2="634" y2="302" stroke="#9A9AA5" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="570" y="294" text-anchor="middle" font-size="10" fill="#6B6B75">bound</text>

  <!-- legend -->
  <circle cx="30" cy="356" r="8" fill="#3D5A80"/>
  <text x="46" y="360" font-size="11" fill="#4A4A55">in the current configuration</text>
  <circle cx="230" cy="356" r="8" fill="none" stroke="#C4C4CC" stroke-width="2"/>
  <text x="246" y="360" font-size="11" fill="#4A4A55">role-capable, not in the current configuration</text>

  <!-- footer notes -->
  <text x="20" y="394" font-size="11.5" fill="#2B2B33">
    <tspan font-weight="bold">Config in use:</tspan> panel = Gemini + Anthropic + OpenAI, final judge = DeepSeek.
  </text>
  <text x="20" y="414" font-size="11.5" fill="#2B2B33">The final judge and transformer are always the same model instance.</text>
  <text x="20" y="434" font-size="11.5" fill="#6B6B75">The fuller v2 ablation (100-row human gold) is designed but on hold.</text>
</svg>
